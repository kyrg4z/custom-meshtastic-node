; Custom Meshtastic node (HT-CT62 + SAM-M10Q + SSD1306 OLED)
; Based on meshtastic/firmware variants/esp32c3/heltec_esp32c3 (env heltec-ht62-esp32c3-sx1262)
[env:kyrg4z-mesh-node]
extends = esp32c3_base
board = esp32-c3-devkitm-1
build_flags =
  ${esp32c3_base.build_flags}
  -D PRIVATE_HW
  -I variants/esp32c3/kyrg4z_mesh_node
  ; console over native USB (GPIO18/19) so UART0 (GPIO20/21) is free for the GPS
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
monitor_speed = 115200
upload_protocol = esptool
upload_speed = 921600
